spring:
  application:
    name: creator-settlement

  datasource:
    url: jdbc:postgresql://localhost:5432/settlement
    username: settlement
    password: settlement
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop      # 개발 단계: 부팅마다 스키마 재생성
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    show-sql: true
    defer-datasource-initialization: true   # data.sql을 ddl 생성 후 실행

  sql:
    init:
      mode: always               # data.sql 항상 실행

  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

settlement:
  # 플랫폼 수수료율 (0.20 = 20%). 변경 가능성을 고려해 설정값으로 분리.
  commission-rate: 0.20

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs